name: Update publications from ORCID

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 1 * *"

permissions:
  contents: write

concurrency:
  group: update-orcid-publications
  cancel-in-progress: false

jobs:
  update-publications:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update README from ORCID
        run: python scripts/update_orcid_publications.py --orcid 0000-0002-4643-0191

      - name: Commit README changes
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update publications from ORCID"
          git push
